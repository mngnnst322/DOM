<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom project</title>
    <link rel="stylesheet" href="dom.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar">
        <span class="time">9:41</span>
        <span class="status-right">
          <span class="signal-bars">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="net">5G</span>
          <span class="battery"></span>
        </span>
      </div>

      <div class="apps-grid">
        <a class="app" href="./calculetar/index.html">
          <img src="calculater.jpeg" alt="" class="icon" />
          <span class="label">Calculator</span>
        </a>
        <a class="app" href="./tip/index.html">
          <img src="./tip image.png" alt="" class="icon" />
          <span class="label">Tip</span>
        </a>
        <a class="app" href="./stopWatch/index.html">
          <img src="./stop watch.png" alt="" class="icon" />
          <span class="label">Stopwatch</span>
        </a>
        <a class="app" href="./xogame/index.html">
          <div class="icon xo-icon">X<span>O</span></div>
          <span class="label">X / O</span>
        </a>
        <a class="app" href="./connectfour/index.html">
          <div class="icon c4-icon">
            <span class="c4-dot red"></span>
            <span class="c4-dot yellow"></span>
            <span class="c4-dot yellow"></span>
            <span class="c4-dot red"></span>
          </div>
          <span class="label">Connect 4</span>
        </a>
      </div>

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="dock">
        <img src="./call.jpeg" alt="Phone" class="sys-icon" />
        <img src="./safari.jpeg" alt="Safari" class="sys-icon" />
        <img src="./messej2.jpeg" alt="Messages" class="sys-icon" />
        <img src="./music2.jpeg" alt="Music" class="sys-icon" />
      </div>
    </div>
  </body>
</html>
